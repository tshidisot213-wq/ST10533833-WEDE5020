<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Enquiry | Ayoba Bakes</title>
    <meta name="description" content="Request a custom cake or place a bulk order with Ayoba Bakes. Fill out our simple enquiry form.">
    <meta name="keywords" content="custom cake order, bakery enquiry, bulk bread order Polokwane">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Ayoba Bakes</h1>
        <p>Place a custom order or ask us a question</p>
        
        <button class="menu-toggle" aria-label="Toggle menu">&#9776;</button>
        
        <nav>
            <ul id="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="enquiry.html" class="active">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Send Us an Enquiry</h2>
        
        <!-- Form success message placeholder -->
        <div id="form-success" class="success-msg"></div>

        <!-- Form with JS validation -->
        <form id="enquiry-form" novalidate>
            <p>
                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" placeholder="Your name" required>
                <span class="error-msg" id="fullname-error">Please enter your name.</span>
            </p>

            <p>
                <label for="email">Email Address:</label>
                <input type="email" id="email" placeholder="you@email.com" required>
                <span class="error-msg" id="email-error">Please enter a valid email address.</span>
            </p>

            <p>
                <label for="ordertype">Type of Enquiry:</label>
                <select id="ordertype">
                    <option value="cake">Custom Cake</option>
                    <option value="bulk">Bulk Order</option>
                    <option value="general">General Question</option>
                </select>
            </p>

            <p>
                <label for="message">Your Message (min 10 characters):</label>
                <textarea id="message" rows="5" placeholder="Tell us what you need..." required></textarea>
                <span class="error-msg" id="message-error">Message must be at least 10 characters.</span>
            </p>

            <p>
                <button type="submit">Send Enquiry</button>
            </p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Ayoba Bakes, Polokwane. All rights reserved.</p>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
